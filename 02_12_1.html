
<!DOCTYPE html>
<html lang="ko">
<head>
  <style> 
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
}

body {
  background-color: #f0f2f5; /* 부드러운 회색 배경 */
  padding: 20px;
  display: flex;
  justify-content: center;
}

/* 2. 전체 컨테이너 */
.container {
  width: 100%;
  max-width: 1200px;
  display: flex;
  flex-direction: column;
  gap: 15px; /* 박스 사이 간격 */
}

/* 3. 공통 박스 스타일 */
.box {
  background-color: #ffffff;
  border-radius: 12px;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #333;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); /* 은은한 그림자 */
  transition: transform 0.2s ease;
}

.box:hover {
  transform: translateY(-2px); /* 마우스 올렸을 때 살짝 들리는 효과 */
}

/* 4. 상단 헤더 */
header.box {
  height: 80px;
  background: linear-gradient(135deg, #6e8efb, #a777e3); /* 그라데이션 포인트 */
  color: white;
  font-size: 1.2rem;
}
footer.box {
  height: 80px;
  background: linear-gradient(135deg, #6e8efb, #a777e3); /* 그라데이션 포인트 */
  color: white;
  font-size: 1.2rem;
}

/* 5. 중간 그룹 (사이드바 + 메인) */
.middle-group {
  display: flex;
  gap: 15px;
  min-height: 500px; /* 최소 높이 설정 */
}

/* 6. 좌우 사이드바 (고정 너비) */
.side {
  flex: 0 0 200px; /* 너비를 200px로 고정 */
  background-color: #f8f9fa;
  border: 1px solid #e9ecef;
  font-size: 0.9rem;
  color: #666;
}

/* 7. 중앙 메인 (유연하게 늘어남) */
.cente {
  flex: 1; /* 남은 공간을 모두 차지함 */
  background-color: #ffffff;
  border: 2px solid #6e8efb; /* 메인 영역 강조 */
  font-size: 1.1rem;
  color: #222;
}

/* 반응형: 화면이 작아지면 세로로 배치 */
@media (max-width: 768px) {
  .middle-group {
    flex-direction: column;
  }
  .side {
    flex: none;
    width: 100%;
  }
}
  </style>
</head>
<body>
    
   <div class="container">
     <header class="box">상단(Header)</header>
    
     <div class="middle-group">
       <aside class="box side">좌측(Aside)</aside>>
       <main class="box center">중앙(Main -나만 늘어남)</main>
       <aside class="box side">우측 (Aside)</aside>
        <footer class="box footer">하단(Footer)</footer>

     
   </div>
    <a href="https://moria153.github.io">구글로 이동하기</a>
</body>
</html>

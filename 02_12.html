<!DOCTYPE html>
<html lang="ko">
<head>
    
    <title></title>
    <style>
    .container {
  display: flex;
  flex-direction: column; /* 위아래로 배치 */
  height: 100vh; /* 화면 전체 높이 사용 */
}

.header, .footer {
  background-color: green;
  color: blue;
  padding: 20px;
  text-align: center;
}

.main-content {
  display: flex; /* 좌우 배치를 위해 Flex 사용 */
  flex: 1; /* 남은 중간 공간을 모두 차지 */
}

.left-pane {
  flex: 1; /* 좌측 너비 비율 (예: 1) */
  background-color: #f0f0f0;
  padding: 20px;
}

.right-pane {
  flex: 1; /* 우측 너비 비율 (예: 1) */
  background-color: #ddd;
  padding: 20px;
}
    
    </style>
</head>
<body>
    <h1></h1>
   <div class="container">
  <header class="header">상단 (Header)</header>
  
  <main class="main-content">
    <aside class="left-pane">좌측 (Left)</aside>
    <section class="right-pane">우측 (Right)</section>
  </main>
  
  <footer class="footer">하단 (Footer)</footer>
</div>
    <a href="https://moria153.github.io/02_12.html">메뉴</a>
</body>
</html>
